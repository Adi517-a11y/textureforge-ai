<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TextureForge AI</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}
:root {
    --bg: #f4f5f8;
    --panel: #ffffff;
    --panel2: #fafbfc;
    --line: #e4e7ed;
    --text: #171b24;
    --muted: #7d8493;
    --accent: #6c5ce7;
    --accent2: #8173f3;
    --danger: #e05263;
    --success: #25ad78;
    --radius: 12px;
}
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    color: var(--text);
    background: var(--bg);
}
button,
input,
textarea,
select {
    font: inherit;
}
button {
    cursor: pointer;
    border: 0;
}
.app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}
/* =========================
   HEADER
========================= */
.header {
    height: 62px;
    flex-shrink: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
}
.logo {
    font-size: 19px;
    font-weight: 850;
    letter-spacing: -.6px;
}
.logo span {
    color: var(--accent);
}
.project-name {
    font-size: 13px;
    color: var(--muted);
    border-left: 1px solid var(--line);
    padding-left: 12px;
}
.header-space {
    flex: 1;
}
.header-button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 9px;
    font-weight: 650;
}
.header-button:hover {
    background: #f5f6f9;
}
.play-button {
    background: var(--text);
    color: white;
    padding: 9px 16px;
    border-radius: 9px;
    font-weight: 750;
}
/* =========================
   MAIN
========================= */
.workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 205px minmax(350px, 1fr) 325px;
}
/* =========================
   LEFT SIDEBAR
========================= */
.sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
}
.sidebar-title {
    padding: 17px 15px 9px;
    font-size: 11px;
    font-weight: 850;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
}
.asset-list {
    flex: 1;
    overflow: auto;
    padding: 7px;
}
.asset {
    padding: 8px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 3px;
}
.asset:hover {
    background: #f5f6f9;
}
.asset.selected {
    background: #efedff;
}
.asset-preview {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: #f0f1f5;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.asset-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
}
.asset-preview span {
    font-size: 17px;
}
.asset-name {
    font-size: 13px;
    font-weight: 650;
    overflow: hidden;
    text-overflow: ellipsis;
}
.new-asset {
    margin: 9px;
    padding: 11px;
    border-radius: 9px;
    color: white;
    background: var(--accent);
    font-weight: 750;
}
.new-asset:hover {
    background: var(--accent2);
}
/* =========================
   CENTER
========================= */
.center {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
}
.tabs {
    height: 47px;
    flex-shrink: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 5px 9px;
    gap: 3px;
}
.tab {
    padding: 8px 13px;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-weight: 700;
}
.tab.active {
    background: #f0efff;
    color: var(--accent);
}
/* =========================
   PAINT
========================= */
.paint {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}
.paint-toolbar {
    height: 50px;
    flex-shrink: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px;
}
.tool {
    height: 35px;
    min-width: 35px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: white;
}
.tool.active {
    background: #efedff;
    border-color: #bcb5ff;
    color: var(--accent);
}
.color {
    width: 39px;
    height: 35px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 2px;
}
.brush {
    width: 55px;
    height: 35px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px;
}
.paint-area {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    background:
        linear-gradient(45deg,#eceef2 25%,transparent 25%),
        linear-gradient(-45deg,#eceef2 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#eceef2 75%),
        linear-gradient(-45deg,transparent 75%,#eceef2 75%);
    background-size: 28px 28px;
    background-position:
        0 0,
        0 14px,
        14px -14px,
        -14px 0;
}
#paintCanvas {
    width: min(65vh,520px);
    height: min(65vh,520px);
    background: white;
    border: 2px solid #cdd2dc;
    box-shadow: 0 12px 35px rgba(20,25,40,.10);
    image-rendering: pixelated;
    touch-action: none;
}
/* =========================
   GAME
========================= */
.game {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
    background: #1b2029;
}
.game-toolbar {
    height: 47px;
    flex-shrink: 0;
    background: #151922;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 9px;
    color: white;
}
.game-toolbar button {
    background: #292f3a;
    border: 1px solid #3b4350;
    color: white;
    padding: 7px 11px;
    border-radius: 7px;
}
.game-status {
    margin-left: auto;
    color: #9aa4b4;
    font-size: 11px;
}
.game-area {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}
#gameCanvas {
    width: min(94%,900px);
    max-height: 90%;
    aspect-ratio: 16 / 9;
    border-radius: 9px;
    background: #9edcff;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
/* =========================
   ANIMATION EDITOR
========================= */
.animation {
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
    background: #f6f7fa;
}
.animation-preview {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(45deg,#e9ebef 25%,transparent 25%),
        linear-gradient(-45deg,#e9ebef 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#e9ebef 75%),
        linear-gradient(-45deg,transparent 75%,#e9ebef 75%);
    background-size: 32px 32px;
    background-position:
        0 0,
        0 16px,
        16px -16px,
        -16px 0;
}
#animationCanvas {
    width: min(50vh,420px);
    height: min(50vh,420px);
    background: white;
    border: 1px solid var(--line);
    image-rendering: pixelated;
}
.animation-bottom {
    height: 150px;
    background: white;
    border-top: 1px solid var(--line);
    padding: 10px;
    overflow-x: auto;
}
.animation-controls {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 9px;
}
.animation-controls button,
.animation-controls select,
.animation-controls input {
    height: 31px;
    border: 1px solid var(--line);
    background: white;
    border-radius: 7px;
    padding: 5px 8px;
}
.frames {
    display: flex;
    gap: 7px;
}
.frame {
    width: 66px;
    height: 66px;
    flex-shrink: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #f3f4f7;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.frame.selected {
    border: 2px solid var(--accent);
}
.frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
}
/* =========================
   RIGHT INSPECTOR
========================= */
.inspector {
    background: var(--panel);
    border-left: 1px solid var(--line);
    min-height: 0;
    display: flex;
    flex-direction: column;
}
.inspector-section {
    padding: 14px;
    border-bottom: 1px solid var(--line);
}
.label {
    color: var(--muted);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: .9px;
    font-weight: 850;
    margin-bottom: 8px;
}
.name {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px;
    outline: none;
}
.name:focus {
    border-color: #aaa1ff;
}
.ai {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}
.ai-input {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px;
    outline: none;
    line-height: 1.45;
}
.ai-button {
    margin-top: 8px;
    padding: 11px;
    border-radius: 9px;
    color: white;
    background: linear-gradient(
        135deg,
        #725de8,
        #8b73ef
    );
    font-weight: 750;
}
.ai-output {
    margin-top: 8px;
    padding: 10px;
    border-radius: 8px;
    background: #f6f7fa;
    color: #697386;
    font-size: 11px;
    line-height: 1.5;
    max-height: 145px;
    overflow: auto;
}
.rules {
    max-height: 190px;
    overflow: auto;
}
.rule {
    padding: 8px;
    background: #f7f8fa;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 11px;
}
.rule-header {
    display: flex;
    justify-content: space-between;
    font-weight: 750;
}
.rule-action {
    color: var(--accent);
}
.delete-rule {
    background: transparent;
    color: var(--danger);
}
/* =========================
   MOBILE CONTROLS
========================= */
.mobile-controls {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
}
.joystick {
    position: absolute;
    left: 25px;
    bottom: 25px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    background: rgba(20,25,35,.28);
    border: 2px solid rgba(255,255,255,.35);
    pointer-events: auto;
    touch-action: none;
}
.joystick-knob {
    position: absolute;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: rgba(255,255,255,.75);
    left: 33px;
    top: 33px;
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
}
.action-buttons {
    position: absolute;
    right: 25px;
    bottom: 25px;
    display: flex;
    gap: 13px;
    pointer-events: auto;
}
.action-button {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    color: white;
    background: rgba(25,30,40,.5);
    border: 2px solid rgba(255,255,255,.4);
    font-weight: 800;
    touch-action: none;
}
.action-button:active {
    transform: scale(.94);
    background: rgba(108,92,231,.75);
}
/* =========================
   STATUS
========================= */
.status {
    height: 27px;
    flex-shrink: 0;
    background: white;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 11px;
    gap: 18px;
    color: var(--muted);
    font-size: 10px;
}
.ready {
    color: var(--success);
}
/* =========================
   TABLET / IPAD
========================= */
@media(max-width:1050px) {
    .workspace {
        grid-template-columns:
            175px
            minmax(300px,1fr)
            285px;
    }
    .header-button {
        display: none;
    }
}
/* =========================
   PHONE
========================= */
@media(max-width:700px) {
    .header {
        height: 55px;
        padding: 0 10px;
    }
    .logo {
        font-size: 16px;
    }
    .project-name {
        display: none;
    }
    .workspace {
        grid-template-columns: 1fr;
    }
    .sidebar,
    .inspector {
        display: none;
    }
    .mobile-controls {
        display: block;
    }
    .paint-toolbar {
        overflow-x: auto;
    }
    #paintCanvas {
        width: 82vw;
        height: 82vw;
    }
    #gameCanvas {
        width: 96%;
    }
    .play-button {
        padding: 8px 12px;
    }
}
/* =========================
   IPAD PORTRAIT
========================= */
@media(
    min-width:701px
) and (
    max-width:900px
) {
    .workspace {
        grid-template-columns:
            180px
            1fr;
    }
    .inspector {
        position: absolute;
        right: 10px;
        bottom: 38px;
        width: 300px;
        max-height: 65%;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 15px 40px rgba(0,0,0,.12);
        z-index: 20;
    }
}
</style>
</head>
<body>
<div class="app">
<header class="header">
    <div class="logo">
        Texture<span>Forge</span> AI
    </div>
    <div class="project-name">
        Untitled Game
    </div>
    <div class="header-space"></div>
    <button class="header-button"
            onclick="saveProject()">
        Save
    </button>
    <button class="header-button"
            onclick="exportProject()">
        Export
    </button>
    <button class="play-button"
            onclick="toggleGame()">
        ▶ Play
    </button>
</header>
<div class="workspace">
<!-- =========================
     ASSETS
========================= -->
<aside class="sidebar">
    <div class="sidebar-title">
        Assets
    </div>
    <div
        id="assetList"
        class="asset-list">
    </div>
    <button
        class="new-asset"
        onclick="createAsset()">
        + New Asset
    </button>
</aside>
<!-- =========================
     CENTER
========================= -->
<main class="center">
    <div class="tabs">
        <button
            id="paintTab"
            class="tab active"
            onclick="showMode('paint')">
            Paint
        </button>
        <button
            id="animationTab"
            class="tab"
            onclick="showMode('animation')">
            Animation
        </button>
        <button
            id="gameTab"
            class="tab"
            onclick="showMode('game')">
            Game
        </button>
    </div>
    <!-- PAINT -->
    <section
        id="paintMode"
        class="paint">
        <div class="paint-toolbar">
            <button
                class="tool active"
                onclick="setTool('pencil')">
                ✎
            </button>
            <button
                class="tool"
                onclick="setTool('eraser')">
                ⌫
            </button>
            <button
                class="tool"
                onclick="clearPaint()">
                Clear
            </button>
            <input
                id="color"
                class="color"
                type="color"
                value="#222222">
            <input
                id="brush"
                class="brush"
                type="number"
                min="1"
                max="80"
                value="10">
        </div>
        <div class="paint-area">
            <canvas
                id="paintCanvas"
                width="512"
                height="512">
            </canvas>
        </div>
    </section>
    <!-- ANIMATION -->
    <section
        id="animationMode"
        class="animation">
        <div class="animation-preview">
            <canvas
                id="animationCanvas"
                width="512"
                height="512">
            </canvas>
        </div>
        <div class="animation-bottom">
            <div class="animation-controls">
                <button onclick="addFrame()">
                    + Frame
                </button>
                <button onclick="deleteFrame()">
                    Delete
                </button>
                <button onclick="playAnimation()">
                    ▶ Preview
                </button>
                <select id="animationSelect"
                        onchange="changeAnimation()">
                    <option value="Idle">
                        Idle
                    </option>
                    <option value="Walk">
                        Walk
                    </option>
                    <option value="Run">
                        Run
                    </option>
                    <option value="Jump">
                        Jump
                    </option>
                    <option value="Fall">
                        Fall
                    </option>
                    <option value="Attack">
                        Attack
                    </option>
                    <option value="Hurt">
                        Hurt
                    </option>
                    <option value="Death">
                        Death
                    </option>
                    <option value="Custom">
                        Custom
                    </option>
                </select>
                <input
                    id="fps"
                    type="number"
                    min="1"
                    max="60"
                    value="8"
                    title="Frames per second">
            </div>
            <div
                id="frames"
                class="frames">
            </div>
        </div>
    </section>
    <!-- GAME -->
    <section
        id="gameMode"
        class="game">
        <div class="game-toolbar">
            <button onclick="startGame()">
                ▶ Start
            </button>
            <button onclick="stopGame()">
                ■ Stop
            </button>
            <button onclick="resetGame()">
                ↻ Reset
            </button>
            <div
                id="gameStatus"
                class="game-status">
                Game stopped
            </div>
        </div>
        <div class="game-area">
            <canvas
                id="gameCanvas"
                width="900"
                height="506">
            </canvas>
            <!-- TOUCH CONTROLS -->
            <div
                id="mobileControls"
                class="mobile-controls">
                <div
                    id="joystick"
                    class="joystick">
                    <div
                        id="joystickKnob"
                        class="joystick-knob">
                    </div>
                </div>
                <div class="action-buttons">
                    <button
                        id="jumpButton"
                        class="action-button">
                        JUMP
                    </button>
                    <button
                        id="actionButton"
                        class="action-button">
                        A
                    </button>
                </div>
            </div>
        </div>
    </section>
</main>
<!-- =========================
     INSPECTOR
========================= -->
<aside class="inspector">
    <div class="inspector-section">
        <div class="label">
            Selected Asset
        </div>
        <input
            id="assetName"
            class="name"
            value="Penguin"
            oninput="renameAsset()">
    </div>
    <div class="inspector-section ai">
        <div class="label">
            AI Behavior
        </div>
        <textarea
            id="aiInput"
            class="ai-input"
            placeholder="Tell the AI what your object should do.
Examples:
Penguin jump if player is close
Penguin follow player
Penguin patrol left and right
Penguin play Walk animation while moving
Penguin play Idle animation when stopped
Penguin disappear when player touches Penguin
Penguin lose 10 health when attacked
Penguin run away if player gets very close"></textarea>
        <button
            class="ai-button"
            onclick="runAI()">
            ✦ Make Behavior Work
        </button>
        <div
            id="aiOutput"
            class="ai-output">
            Behavior compiler ready.
        </div>
    </div>
    <div class="inspector-section">
        <div class="label">
            Active Behaviors
        </div>
        <div
            id="ruleList"
            class="rules">
        </div>
    </div>
</aside>
</div>
<div class="status">
    <span>
        TextureForge AI 0.3.0
    </span>
    <span id="statusText">
        Ready
    </span>
    <span class="ready">
        ● Engine Ready
    </span>
</div>
</div>
<script>
/* =========================================================
   DATA
========================================================= */
let assets = [];
let selectedAsset = 0;
let currentTool = "pencil";
let currentMode = "paint";
let gameRunning = false;
let gameObjects = [];
let lastTime = 0;
let particles = [];
let animationPlaying = false;
/* =========================================================
   PAINT
========================================================= */
const paintCanvas =
    document.getElementById("paintCanvas");
const paintCtx =
    paintCanvas.getContext("2d");
function blankPaint() {
    paintCtx.globalCompositeOperation =
        "source-over";
    paintCtx.fillStyle =
        "white";
    paintCtx.fillRect(
        0,
        0,
        512,
        512
    );
}
function paintPosition(e) {
    const rect =
        paintCanvas.getBoundingClientRect();
    return {
        x:
            (e.clientX - rect.left)
            * 512 / rect.width,
        y:
            (e.clientY - rect.top)
            * 512 / rect.height
    };
}
function drawPaint(e) {
    if (!drawing) return;
    const p =
        paintPosition(e);
    const size =
        Number(
            document.getElementById(
                "brush"
            ).value
        );
    paintCtx.lineWidth =
        size;
    paintCtx.lineCap =
        "round";
    if (
        currentTool === "eraser"
    ) {
        paintCtx.globalCompositeOperation =
            "destination-out";
    } else {
        paintCtx.globalCompositeOperation =
            "source-over";
        paintCtx.strokeStyle =
            document.getElementById(
                "color"
            ).value;
    }
    paintCtx.lineTo(
        p.x,
        p.y
    );
    paintCtx.stroke();
    paintCtx.beginPath();
    paintCtx.moveTo(
        p.x,
        p.y
    );
}
let drawing = false;
paintCanvas.addEventListener(
    "pointerdown",
    e => {
        drawing = true;
        const p =
            paintPosition(e);
        paintCtx.beginPath();
        paintCtx.moveTo(
            p.x,
            p.y
        );
        drawPaint(e);
    }
);
paintCanvas.addEventListener(
    "pointermove",
    drawPaint
);
paintCanvas.addEventListener(
    "pointerup",
    finishPaint
);
paintCanvas.addEventListener(
    "pointercancel",
    finishPaint
);
function finishPaint() {

function cleanName(name) {
    return name
        .trim()
        .replace(/\s+/g,"_")
        .replace(
            /[^a-zA-Z0-9_]/g,
            ""
        ) || "Asset";
}
function createAsset() {
    const name =
        prompt(
            "Name the asset:",
            "Penguin"
        );
    if (!name)
        return;
    assets.push({
        name:
            cleanName(name),
        texture:
            null,
        animations:
            createDefaultAnimations(),
        rules: [],
        properties: {
            health: 100,
            speed: 2,
            jumpPower: 9
        }
    });
    selectedAsset =
        assets.length - 1;
    blankPaint();
    renderAssets();
    renderRules();
    renderFrames();
    updateAnimationPreview();
    setStatus(
        "Created " +
        assets[selectedAsset].name
    );
}
function createDefaultAnimations() {
    return {
        Idle: [],
        Walk: [],
        Run: [],
        Jump: [],
        Fall: [],
        Attack: [],
        Hurt: [],
        Death: [],
        Custom: []
    };
}
function renameAsset() {

        return;
    assets[selectedAsset].name =
        cleanName(
            document.getElementById(
                "assetName"
            ).value
        );
    renderAssets();

    renderFrames();

function renderAssets() {

        (asset,index) => {

                document.createElement(

                );

                    : ""
                );

                    "div"
                );

                    document.createElement(
                        "img"
                    );
                img.src =
                    asset.texture;
                preview.appendChild(
                    img
                );
            } else {
                const span =
                    document.createElement(
                        "span"
                    );
                span.textContent =
                    "◆";
                preview.appendChild(
                    span
                );
            }

                document.createElement(
                    "div"

function loadTexture() {
    blankPaint();

   ANIMATION EDITOR
========================================================= */
let selectedAnimation =
    "Idle";
let selectedFrame = 0;
function changeAnimation() {
    selectedAnimation =
        document.getElementById(
            "animationSelect"
        ).value;
    selectedFrame = 0;
    renderFrames();
    updateAnimationPreview();
}
function addFrame() {
    const asset =
        assets[selectedAsset];
    if (!asset)
        return;
    saveTexture();
    asset.animations[
        selectedAnimation
    ].push(
        asset.texture
    );
    selectedFrame =
        asset.animations[
            selectedAnimation
        ].length - 1;
    renderFrames();
    updateAnimationPreview();
    saveProject();
}
function deleteFrame() {
    const frames =
        assets[selectedAsset]
            .animations[
                selectedAnimation
            ];
    if (!frames.length)
        return;
    frames.splice(
        selectedFrame,
        1
    );
    selectedFrame =
        Math.max(
            0,
            selectedFrame - 1
        );
    renderFrames();
    updateAnimationPreview();
}
function renderFrames() {
    const container =
        document.getElementById(
            "frames"
        );
    container.innerHTML = "";
    const frames =
        assets[selectedAsset]
            ?.animations[
                selectedAnimation
            ] || [];
    frames.forEach(
        (src,index) => {
            const frame =
                document.createElement(
                    "div"
                );
            frame.className =
                "frame" +
                (
                    index ===
                    selectedFrame
                    ? " selected"
                    : ""
                );
            if (src) {
                const img =
                    document.createElement(
                        "img"
                    );
                img.src = src;
                frame.appendChild(
                    img
                );
            }
            frame.onclick = () => {
                selectedFrame =
                    index;
                updateAnimationPreview();
                renderFrames();
            };
            container.appendChild(
                frame
            );
        }
    );
}
function updateAnimationPreview() {
    const canvas =
        document.getElementById(
            "animationCanvas"
        );
    const ctx =
        canvas.getContext("2d");
    ctx.clearRect(
        0,
        0,
        512,
        512
    );
    const frames =
        assets[selectedAsset]
            ?.animations[
                selectedAnimation
            ] || [];
    const src =
        frames[selectedFrame] ||
        assets[selectedAsset]?.texture;
    if (!src)
        return;
    const image =
        new Image();
    image.onload = () => {
        ctx.imageSmoothingEnabled =
            false;
        ctx.drawImage(
            image,
            0,
            0,
            512,
            512
        );
    };
    image.src =
        src;
}
function playAnimation() {
    const frames =
        assets[selectedAsset]
            ?.animations[
                selectedAnimation
            ] || [];
    if (!frames.length) {
        setStatus(
            "Add animation frames first"
        );
        return;
    }
    animationPlaying = true;
    let frame = 0;
    const fps =
        Number(
            document.getElementById(
                "fps"
            ).value
        ) || 8;
    const interval =
        1000 / fps;
    const timer =
        setInterval(
            () => {
                if (!animationPlaying) {
                    clearInterval(timer);
                    return;
                }
                selectedFrame =
                    frame %
                    frames.length;
                updateAnimationPreview();
                renderFrames();
                frame++;
            },
            interval
        );
    setTimeout(
        () => {
            animationPlaying =
                false;
        },
        Math.max(
            2000,
            frames.length *
            interval *
            3
        )
    );
}
/* =========================================================
   AI COMPILER
========================================================= */
function runAI() {
    const text =
        document.getElementById(
            "aiInput"
        ).value.trim();
    if (!text)
        return;
    const result =
        compileBehavior(text);
    if (!result) {
        showAI(
            "I couldn't compile that behavior yet.\n\n" +
            "Try combining an object, condition and action."
        );
        return;
    }
    const asset =
        findAsset(
            result.target
        );
    if (!asset) {
        showAI(
            "The object '" +
            result.target +
            "' doesn't exist."
        );
        return;
    }
    asset.rules.push(
        result
    );
    renderRules();
    saveProject();
    showAI(
        "✓ Behavior compiled\n\n" +
        "Object: " +
        result.target +
        "\n" +
        "Condition: " +
        result.trigger +
        "\n" +
        "Action: " +
        result.action +
        "\n\n" +
        result.code
    );
}
function findAsset(name) {
    return assets.find(
        asset =>
            asset.name.toLowerCase() ===
            name.toLowerCase()
    );
}
function detectTarget(text) {
    const lower =
        text.toLowerCase();
    for (
        const asset of assets
    ) {
        if (
            lower.includes(
                asset.name.toLowerCase()
            )
        ) {
            return asset.name;
        }
    }
    return assets[
        selectedAsset
    ]?.name || "Player";
}
/* =========================================================
   BEHAVIOR LANGUAGE
========================================================= */
function compileBehavior(text) {
    const lower =
        text.toLowerCase();
    const target =
        detectTarget(text);
    /* JUMP */
    if (
        lower.includes("jump") &&
        (
            lower.includes("close") ||
            lower.includes("near")
        )
    ) {
        return {
            target,
            trigger:
                "player is near",
            action:
                "jump",
            type:
                "jumpNear",
            code:
`if (distance(${target}, player) < 150) {
    ${target}.jump();
}`
        };
    }
    /* FOLLOW */
    if (
        lower.includes("follow") ||
        lower.includes("move toward") ||
        lower.includes("move towards")
    ) {
        return {
            target,
            trigger:
                "player is nearby",
            action:
                "follow player",
            type:
                "follow",
            code:
`if (distance(${target}, player) < 350) {
    ${target}.moveToward(player);
}`
        };
    }
    /* RUN AWAY */
    if (
        lower.includes("run away") ||
        lower.includes("flee") ||
        lower.includes("escape")
    ) {
        return {
            target,
            trigger:
                "player is very close",
            action:
                "run away from player",
            type:
                "flee",
            code:
`if (distance(${target}, player) < 180) {
    ${target}.runAwayFrom(player);
}`
        };
    }
    /* CHASE */
    if (
        lower.includes("chase")
    ) {
        return {
            target,
            trigger:
                "player detected",
            action:
                "chase player",
            type:
                "chase",
            code:
`if (distance(${target}, player) < 350) {
    ${target}.chase(player);
}`
        };
    }
    /* PATROL */
    if (
        lower.includes("patrol")
    ) {
        return {
            target,
            trigger:
                "always",
            action:
                "patrol",
            type:
                "patrol",
            code:
`everyFrame(() => {
    ${target}.patrol();
});`
        };
    }
    /* ANIMATION WHILE MOVING */
    if (
        (
            lower.includes("play walk") ||
            lower.includes("play walking") ||
            lower.includes("walk animation")
        ) &&
        lower.includes("moving")
    ) {
        return {
            target,
            trigger:
                "object is moving",
            action:
                "play Walk animation",
            type:
                "animationMoving",
            animation:
                "Walk",
            code:
`if (${target}.velocityX !== 0) {
    ${target}.playAnimation("Walk");
}`
        };
    }
    /* IDLE ANIMATION */
    if (
        lower.includes("idle") &&
        (
            lower.includes("stopped") ||
            lower.includes("not moving")
        )
    ) {
        return {
            target,
            trigger:
                "object is not moving",
            action:
                "play Idle animation",
            type:
                "animationIdle",
            animation:
                "Idle",
            code:
`if (${target}.velocityX === 0) {
    ${target}.playAnimation("Idle");
}`
        };
    }
    /* JUMP ANIMATION */
    if (
        lower.includes("jump animation")
    ) {
        return {
            target,
            trigger:
                "object is jumping",
            action:
                "play Jump animation",
            type:
                "animationJump",
            animation:
                "Jump",
            code:
`if (${target}.velocityY < 0) {
    ${target}.playAnimation("Jump");
}`
        };
    }
    /* DISAPPEAR */
    if (
        lower.includes("disappear") &&
        (
            lower.includes("touch") ||
            lower.includes("player")
        )
    ) {
        return {
            target,
            trigger:
                "player touches object",
            action:
                "disappear",
            type:
                "destroyTouch",
            code:
`if (${target}.touching(player)) {
    ${target}.destroy();
}`
        };
    }
    /* HEALTH DAMAGE */
    if (
        lower.includes("lose") &&
        lower.includes("health")
    ) {
        const match =
            lower.match(
                /lose\s+(\d+)\s+health/
            );
        const amount =
            match
            ? Number(match[1])
            : 10;
        return {
            target,
            trigger:
                "object is attacked",
            action:
                "lose " +
                amount +
                " health",
            type:
                "damage",
            amount,
            code:
`if (${target}.attacked) {
    ${target}.health -= ${amount};
}`
        };
    }
    /* EXPLODE */
    if (
        lower.includes("explode")
    ) {
        return {
            target,
            trigger:
                "player touches object",
            action:
                "explode",
            type:
                "explode",
            code:
`if (${target}.touching(player)) {
    ${target}.explode();
}`
        };
    }
    /* BOUNCE */
    if (
        lower.includes("bounce")
    ) {
        return {
            target,
            trigger:
                "object touches ground",
            action:
                "bounce",
            type:
                "bounce",
            code:
`if (${target}.onGround) {
    ${target}.velocityY = -9;
}`
        };
    }
    /* ROTATE */
    if (
        lower.includes("rotate") ||
        lower.includes("spin")
    ) {
        return {
            target,
            trigger:
                "always",
            action:
                "rotate",
            type:
                "rotate",
            code:
`everyFrame(() => {
    ${target}.rotation += 2;
});`
        };
    }
    /* GROW */
    if (
        lower.includes("grow")
    ) {
        return {
            target,
            trigger:
                "player is nearby",
            action:
                "grow",
            type:
                "grow",
            code:
`if (distance(${target}, player) < 180) {
    ${target}.scale += 0.01;
}`
        };
    }
    /* SHRINK */
    if (
        lower.includes("shrink")
    ) {
        return {
            target,
            trigger:
                "player is nearby",
            action:
                "shrink",
            type:
                "shrink",
            code:
`if (distance(${target}, player) < 180) {
    ${target}.scale -= 0.01;
}`
        };
    }
    /* TELEPORT */
    if (
        lower.includes("teleport")
    ) {
        return {
            target,
            trigger:
                "player gets close",
            action:
                "teleport",
            type:
                "teleport",
            code:
`if (distance(${target}, player) < 120) {
    ${target}.teleport(randomPosition());
}`
        };
    }
    return null;
}

/* =========================
   PLAYER
========================= */
function updatePlayer(dt) {
    let inputX = 0;
    if (
        keys["arrowleft"] ||
        keys["a"]
    )
        inputX--;
    if (
        keys["arrowright"] ||
        keys["d"]
    )
        inputX++;
    inputX +=
        joystickX;
    inputX =
        Math.max(
            -1,
            Math.min(
                1,
                inputX
            )
        );
    player.velocityX =
        inputX *
        player.speed;
    if (
        (
            keys["arrowup"] ||
            keys["w"] ||
            keys[" "]
        ) &&
        player.onGround
    ) {
        jumpPlayer();
    }
    player.velocityY +=
        .45 * dt;
    player.x +=
        player.velocityX * dt;
    player.y +=
        player.velocityY * dt;
    const ground =
        gameCanvas.height -
        55;
    if (
        player.y +
        player.height >=
        ground
    ) {
        player.y =
            ground -
            player.height;
        player.velocityY = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }
    player.x =
        Math.max(
            0,
            Math.min(
                gameCanvas.width -
                player.width,
                player.x
            )
        );
}
function jumpPlayer() {
    if (!player.onGround)
        return;
    player.velocityY =
        -player.jumpPower;
    player.onGround =
        false;
}
/* =========================
   OBJECT RULES
========================= */
function updateObject(obj,dt) {
    if (!obj.visible)
        return;
    obj.animationTimer += dt;
    const distanceToPlayer =
        distance(
            obj,
            player
        );
    for (
        const rule of obj.asset.rules
    ) {
        switch(rule.type) {
            case "jumpNear":
                if (
                    distanceToPlayer <
                    150 &&
                    Math.abs(
                        obj.velocityY
                    ) < .1
                ) {
                    obj.velocityY =
                        -9;
                }
                break;
            case "follow":
                if (
                    distanceToPlayer <
                    350
                ) {
                    obj.velocityX =
                        player.x >
                        obj.x
                        ? 2
                        : -2;
                }
                break;
            case "flee":
                if (
                    distanceToPlayer <
                    180
                ) {
                    obj.velocityX =
                        player.x >
                        obj.x
                        ? -3
                        : 3;
                }
                break;
            case "chase":
                if (
                    distanceToPlayer <
                    350
                ) {
                    obj.velocityX =
                        player.x >
                        obj.x
                        ? 3
                        : -3;
                }
                break;
            case "patrol":
                if (
                    obj.x <
                    100
                )
                    obj.direction = 1;
                if (
                    obj.x >
                    760
                )
                    obj.direction = -1;
                obj.velocityX =
                    obj.direction *
                    1.5;
                break;
            case "animationMoving":
                if (
                    Math.abs(
                        obj.velocityX
                    ) > .1
                ) {
                    setObjectAnimation(
                        obj,
                        "Walk"
                    );
                }
                break;
            case "animationIdle":
                if (
                    Math.abs(
                        obj.velocityX
                    ) < .1
                ) {
                    setObjectAnimation(
                        obj,
                        "Idle"
                    );
                }
                break;
            case "animationJump":
                if (
                    obj.velocityY < 0
                ) {
                    setObjectAnimation(
                        obj,
                        "Jump"
                    );
                }
                break;
            case "destroyTouch":
                if (
                    touching(
                        obj,
                        player
                    )
                ) {
                    obj.visible =
                        false;
                }
                break;
            case "bounce":
                if (
                    obj.y +
                    obj.height >=
                    gameCanvas.height -
                    55
                ) {
                    obj.velocityY =
                        -9;
                }
                break;
            case "rotate":
                obj.rotation +=
                    .04 * dt;
                break;
            case "grow":
                if (
                    distanceToPlayer <
                    180
                ) {
                    obj.scale =
                        Math.min(
                            2,
                            obj.scale +
                            .004 * dt
                        );
                }
                break;
            case "shrink":
                if (
                    distanceToPlayer <
                    180
                ) {
                    obj.scale =
                        Math.max(
                            .3,
                            obj.scale -
                            .004 * dt
                        );
                }
                break;
            case "explode":
                if (
                    touching(
                        obj,
                        player
                    )
                ) {
                    obj.visible =
                        false;
                    createParticles(
                        obj.x,
                        obj.y
                    );
                }
                break;
            case "teleport":
                if (
                    distanceToPlayer <
                    120 &&
                    Math.random() <
                    .01
                ) {
                    obj.x =
                        80 +
                        Math.random() *
                        700;
                    obj.y =
                        100 +
                        Math.random() *
                        180;
                }
                break;
        }
    }
    obj.velocityY +=
        .45 * dt;
    obj.x +=
        obj.velocityX * dt;
    obj.y +=
        obj.velocityY * dt;
    const ground =
        gameCanvas.height -
        55;
    if (
        obj.y +
        obj.height >=
        ground
    ) {
        obj.y =
            ground -
            obj.height;
        obj.velocityY = 0;
    }
    obj.x =
        Math.max(
            0,
            Math.min(
                gameCanvas.width -
                obj.width,
                obj.x
            )
        );
    updateObjectAnimation(
        obj
    );
}
/* =========================================================
   ANIMATION RUNTIME
========================================================= */
function setObjectAnimation(
    obj,
    animation
) {
    if (
        obj.animation !==
        animation
    ) {
        obj.animation =
            animation;
        obj.animationFrame =
            0;
        obj.animationTimer =
            0;
    }
}
function updateObjectAnimation(obj) {
    const frames =
        obj.asset
            .animations[
                obj.animation
            ] || [];
    if (!frames.length)
        return;
    const fps = 8;
    if (
        obj.animationTimer >
        60 / fps
    ) {
        obj.animationTimer = 0;
        obj.animationFrame =
            (
                obj.animationFrame + 1
            ) %
            frames.length;
    }
}

   PARTICLES
========================================================= */
function createParticles(x,y) {
    for (
        let i=0;
        i<25;
        i++
    ) {
        particles.push({
            x,
            y,
            vx:
                (
                    Math.random() -
                    .5
                ) * 8,
            vy:
                (
                    Math.random() -
                    .5
                ) * 8,
            life: 1
        });
    }
}
function updateParticles() {
    particles.forEach(
        p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += .15;
            p.life -= .025;
        }
    );
    particles =
        particles.filter(
            p =>
                p.life > 0
        );
}
/* =========================================================
   GAME LOOP
========================================================= */
function startGame() {
    if (gameRunning)
        return;
    gameRunning = true;
    buildGameObjects();
    resetPlayer();
    document.getElementById(
        "gameStatus"
    ).textContent =
        "Game running";
    lastTime =
        performance.now();
    requestAnimationFrame(
        gameLoop
    );
}
function stopGame() {
    gameRunning =
        false;
    document.getElementById(
        "gameStatus"
    ).textContent =
        "Game stopped";
}
function resetGame() {
    buildGameObjects();
    resetPlayer();
    particles = [];
    drawGame();
}
function resetPlayer() {
    player.x = 430;
    player.y = 350;
    player.velocityX = 0;
    player.velocityY = 0;
}
function gameLoop(time) {
    if (!gameRunning)
        return;
    const dt =
        Math.min(
            (time-lastTime) /
            16.67,
            2
        );
    lastTime =
        time;
    updatePlayer(dt);
    gameObjects.forEach(
        obj =>
            updateObject(
                obj,
                dt
            )
    );
    updateParticles();
    drawGame();
    requestAnimationFrame(
        gameLoop
    );
}
/* =========================================================
   GAME RENDERING
========================================================= */
function drawGame() {
    gameCtx.clearRect(
        0,
        0,
        900,
        506
    );
    const sky =
        gameCtx.createLinearGradient(
            0,
            0,
            0,
            506
        );
    sky.addColorStop(
        0,
        "#9bdcff"
    );
    sky.addColorStop(
        1,
        "#e5f8ff"
    );
    gameCtx.fillStyle =
        sky;
    gameCtx.fillRect(
        0,
        0,
        900,
        506
    );
    /* SUN */
    gameCtx.fillStyle =
        "#fff0a8";
    gameCtx.beginPath();
    gameCtx.arc(
        760,
        80,
        35,
        0,
        Math.PI * 2
    );
    gameCtx.fill();
    /* CLOUDS */
    gameCtx.fillStyle =
        "rgba(255,255,255,.75)";
    for (
        let i=0;
        i<4;
        i++
    ) {
        const x =
            80 + i * 230;
        const y =
            80 + (i%2)*35;
        gameCtx.beginPath();
        gameCtx.arc(
            x,
            y,
            20,
            0,
            Math.PI*2
        );
        gameCtx.arc(
            x+25,
            y-9,
            28,
            0,
            Math.PI*2
        );
        gameCtx.arc(
            x+55,
            y,
            20,
            0,
            Math.PI*2
        );
        gameCtx.fill();
    }
    /* GROUND */
    gameCtx.fillStyle =
        "#65ad55";
    gameCtx.fillRect(
        0,
        451,
        900,
        55
    );
    gameObjects.forEach(
        drawObject
    );
    drawPlayer();
    particles.forEach(
        p => {
            gameCtx.globalAlpha =
                p.life;
            gameCtx.fillStyle =
                "#ffb347";
            gameCtx.fillRect(
                p.x,
                p.y,
                7,
                7
            );
        }
    );
    gameCtx.globalAlpha = 1;
    /* CONTROLS LABEL */
    gameCtx.fillStyle =
        "rgba(0,0,0,.3)";
    gameCtx.fillRect(
        15,
        15,
        185,
        34
    );
    gameCtx.fillStyle =
        "white";
    gameCtx.font =
        "13px Arial";
    gameCtx.fillText(
        "WASD / Arrows / Touch",
        26,
        37
    );
}
function drawPlayer() {
    gameCtx.fillStyle =
        "#655cf0";
    gameCtx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );
    gameCtx.fillStyle =
        "white";
    gameCtx.fillRect(
        player.x+7,
        player.y+9,
        7,
        7
    );
    gameCtx.fillRect(
        player.x+22,
        player.y+9,
        7,
        7
    );
}
function drawObject(obj) {
    if (!obj.visible)
        return;
    const frames =
        obj.asset
            .animations[
                obj.animation
            ] || [];
    let source =
        obj.asset.texture;
    if (
        frames.length
    ) {
        source =
            frames[
                obj.animationFrame %
                frames.length
            ];
    }
    const cx =
        obj.x +
        obj.width/2;
    const cy =
        obj.y +
        obj.height/2;
    gameCtx.save();
    gameCtx.translate(
        cx,
        cy
    );
    gameCtx.rotate(
        obj.rotation
    );
    gameCtx.scale(
        obj.scale,
        obj.scale
    );
    if (source) {
        if (
            !obj.imageCache[source]
        ) {
            const image =
                new Image();
            image.src =
                source;
            obj.imageCache[source] =
                image;
        }
        const image =
            obj.imageCache[source];
        if (
            image.complete
        ) {
            gameCtx.drawImage(
                image,
                -obj.width/2,
                -obj.height/2,
                obj.width,
                obj.height
            );
        }
    } else {
        gameCtx.fillStyle =
            "#333847";
        gameCtx.beginPath();
        gameCtx.roundRect(
            -obj.width/2,
            -obj.height/2,
            obj.width,
            obj.height,
            12
        );
        gameCtx.fill();
        gameCtx.fillStyle =
            "white";
        gameCtx.font =
            "9px Arial";
        gameCtx.textAlign =
            "center";
        gameCtx.fillText(
            obj.asset.name
                .substring(0,9),
            0,
            3
        );
    }
    gameCtx.restore();
}
/* =========================================================
   COLLISIONS
========================================================= */
function distance(a,b) {
    const ax =
        a.x+a.width/2;
    const ay =
        a.y+a.height/2;
    const bx =
        b.x+b.width/2;
    const by =
        b.y+b.height/2;
    return Math.hypot(
        ax-bx,
        ay-by
    );
}
function touching(a,b) {
    return (
        a.x <
        b.x+b.width &&
        a.x+a.width >
        b.x &&
        a.y <
        b.y+b.height &&
        a.y+a.height >
        b.y
    );
}
/* =========================================================
   IPAD JOYSTICK
========================================================= */
let joystickX = 0;
const joystick =
    document.getElementById(
        "joystick"
    );
const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );
function updateJoystick(e) {
    const rect =
        joystick.getBoundingClientRect();
    const centerX =
        rect.left +
        rect.width/2;
    let x =
        e.clientX -
        centerX;
    const max =
        35;
    x =
        Math.max(
            -max,
            Math.min(
                max,
                x
            )
        );
    joystickX =
        x/max;
    joystickKnob.style.transform =
        `translate(${x}px,0)`;
}
function resetJoystick() {
    joystickX = 0;
    joystickKnob.style.transform =
        "translate(0,0)";
}
joystick.addEventListener(
    "pointerdown",
    e => {
        joystick.setPointerCapture(
            e.pointerId
        );
        updateJoystick(e);
    }
);
joystick.addEventListener(
    "pointermove",
    e => {
        if (
            joystick.hasPointerCapture(
                e.pointerId
            )
        ) {
            updateJoystick(e);
        }
    }
);
joystick.addEventListener(
    "pointerup",
    resetJoystick
);
joystick.addEventListener(
    "pointercancel",
    resetJoystick
);
document.getElementById(
    "jumpButton"
).addEventListener(
    "pointerdown",
    e => {
        e.preventDefault();
        jumpPlayer();
    }
);
document.getElementById(
    "actionButton"
).addEventListener(
    "pointerdown",
    e => {
        e.preventDefault();
        keys["e"] = true;
        setTimeout(
            () => {
                keys["e"] = false;
            },
            150
        );
    }
);
/* =========================================================
   MODES
========================================================= */
function showMode(mode) {
    currentMode =
        mode;
    document.getElementById(
        "paintMode"
    ).style.display =
        mode === "paint"
        ? "flex"
        : "none";
    document.getElementById(
        "animationMode"
    ).style.display =
        mode === "animation"
        ? "flex"
        : "none";
    document.getElementById(
        "gameMode"
    ).style.display =
        mode === "game"
        ? "flex"
        : "none";
    document.querySelectorAll(
        ".tab"
    ).forEach(
        tab =>
            tab.classList.remove(
                "active"
            )
    );
    if (mode === "paint")
        document.getElementById(
            "paintTab"
        ).classList.add("active");
    if (mode === "animation")
        document.getElementById(
            "animationTab"
        ).classList.add("active");
    if (mode === "game")
        document.getElementById(
            "gameTab"
        ).classList.add("active");
    if (mode === "animation") {
        renderFrames();
        updateAnimationPreview();
    }
    if (mode === "game") {
        drawGame();
    }
}
function toggleGame() {
    showMode("game");
    if (gameRunning)
        stopGame();
    else
        startGame();
}
/* =========================================================
   SAVE
========================================================= */
function saveProject() {
    saveTexture();
    localStorage.setItem(
        "textureforge-project-v030",
        JSON.stringify(
            assets
        )
    );
    setStatus(
        "Project saved"
    );
}
function exportProject() {
    saveTexture();
    const project = {
        engine:
            "TextureForge AI",
        version:
            "0.3.0",
        assets
    };
    const blob =
        new Blob(
            [
                JSON.stringify(
                    project,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );
    const url =
        URL.createObjectURL(
            blob
        );
    const link =
        document.createElement(
            "a"
        );
    link.href =
        url;
    link.download =
        "textureforge-game.json";
    link.click();
    URL.revokeObjectURL(
        url
    );
    setStatus(
        "Project exported"
    );
}
/* =========================================================
   UTILITIES
========================================================= */
function setStatus(text) {
    document.getElementById(
        "statusText"
    ).textContent =
        text;
}
function showAI(text) {
    document.getElementById(
        "aiOutput"
    ).textContent =
        text;
}
function escapeHTML(text) {
    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
/* =========================================================
   LOAD PROJECT
========================================================= */
function initialize() {
    const saved =
        localStorage.getItem(
            "textureforge-project-v030"
        );
    if (saved) {
        try {
            assets =
                JSON.parse(
                    saved
                );
        } catch {
            assets = [];
        }
    }
    if (!assets.length) {
        assets = [
            {
                name:
                    "Penguin",
                texture:
                    null,
                animations:
                    createDefaultAnimations(),
                rules: [],
                properties: {
                    health: 100,
                    speed: 2,
                    jumpPower: 9
                }
            }
        ];
    }
    /*
       Repair projects created by
       earlier versions.
    */
    assets.forEach(
        asset => {
            if (!asset.animations)
                asset.animations =
                    createDefaultAnimations();
            if (!asset.rules)
                asset.rules = [];
            if (!asset.properties)
                asset.properties = {
                    health: 100,
                    speed: 2,
                    jumpPower: 9
                };
        }
    );
    selectedAsset = 0;
    blankPaint();
    loadTexture();
    renderAssets();
    renderRules();
    renderFrames();
    drawGame();
}
initialize();
</script>
